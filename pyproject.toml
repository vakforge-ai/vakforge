[project]
name = "vakforge"
version = "0.3.0"
description = "Turn the data your company already has into a self-hosted, real-time voice assistant."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "vakforge", email = "vakforge.ai@gmail.com" }]
keywords = ["voice-agent", "speech-to-speech", "fine-tuning", "realtime", "locale"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  # Every version requires-python admits is one CI runs the suite on. Classifiers are
  # labels; requires-python is what pip enforces, so an untested version it admits is
  # installed untested regardless of what is listed here.
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
# Core must import with zero ML deps.
dependencies = [
  "typer>=0.12",
  "pydantic>=2.7",
  "rich>=13",
  "numpy>=1.26",
  "soundfile>=0.12",
  "pyyaml>=6",
  "jsonschema>=4.21",
]

[project.optional-dependencies]
# Recipe extras are filled in when each recipe lands, after verifying the
# upstream package name and pinning a version. Empty on purpose until then.
lfm25 = []    # TODO(verify): liquid-audio + torch pin, Phase 5
moshi = []    # TODO(verify): moshi-finetune commit pin, Phase 6
qwen = []     # TODO(verify): ms-swift / transformers pins, Phase 6
cascade = []  # TODO(verify): pipecat, faster-whisper, TTS pins, Phase 6
dev = [
  "pytest>=8",
  "ruff>=0.5",
]

[project.scripts]
vakforge = "vakforge.cli:app"

[project.urls]
# These become the sidebar links on the PyPI page, which is the only navigation
# someone who found the package through pip ever gets.
Homepage = "https://vakforge.pages.dev"
Documentation = "https://vakforge.pages.dev/docs/"
Repository = "https://github.com/vakforge-ai/vakforge"
Issues = "https://github.com/vakforge-ai/vakforge/issues"
Changelog = "https://github.com/vakforge-ai/vakforge/releases"

[build-system]
# Pinned exactly: the build backend runs at release time and produces what goes to
# PyPI, so a floating version means the same commit can build a different wheel next
# week. Bump it deliberately.
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vakforge"]

[tool.hatch.build.targets.sdist]
exclude = ["site", ".github"]

[tool.uv]
default-groups = []

[dependency-groups]
ci = [
    "pip-audit>=2.10.1",
    "pytest-cov>=7.1.0",
    "twine>=7.0.0",
]
dev = ["pytest>=8", "ruff>=0.5"]
docs = ["markdown-it-py>=3", "pygments>=2.17"]  # scripts/build_docs.py -> site/docs/

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not gpu and not model'"
markers = [
  "gpu: needs a CUDA GPU (opt-in: pytest -m gpu)",
  "model: downloads model weights (opt-in: pytest -m model)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
