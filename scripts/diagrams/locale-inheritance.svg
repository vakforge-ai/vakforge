<svg class="diagram" viewBox="0 0 740 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="locT locD">
  <title id="locT">Locale pack inheritance</title>
  <desc id="locD">A tree. LocalePack is the base, holding formats, PII patterns, consent, privacy notes and recipe support. The en pack inherits from it and adds email, card and IBAN patterns plus an English word-error-rate normalizer. en-US, en-GB and en-IN inherit from en, each adding its own national identifiers, phone formats and currency. hi-Latn-IN inherits from en-IN and adds Roman-Hindi detection, lang_mix and a Devanagari-safe normalizer.</desc>
  <defs>
    <marker id="locHead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M1 1.5 L8.5 5 L1 8.5" class="d-head"/>
    </marker>
  </defs>

  <rect class="d-box d-accent" x="160" y="20" width="420" height="64" rx="11"/>
  <text class="d-t" x="370" y="46">LocalePack</text>
  <text class="d-s" x="370" y="66">formats · PII patterns · consent · privacy notes · recipe support</text>

  <path class="d-line" d="M370 84 L370 118" marker-end="url(#locHead)"/>

  <rect class="d-box" x="245" y="122" width="250" height="62" rx="11"/>
  <text class="d-t" x="370" y="147">en</text>
  <text class="d-s" x="370" y="167">email · card (Luhn) · IBAN · WER</text>

  <path class="d-line" d="M370 184 L370 204"/>
  <path class="d-line" d="M135 204 L605 204"/>
  <path class="d-line" d="M135 204 L135 220" marker-end="url(#locHead)"/>
  <path class="d-line" d="M370 204 L370 220" marker-end="url(#locHead)"/>
  <path class="d-line" d="M605 204 L605 220" marker-end="url(#locHead)"/>

  <rect class="d-box" x="30" y="224" width="210" height="72" rx="11"/>
  <text class="d-t" x="135" y="252">en-US</text>
  <text class="d-s" x="135" y="272">SSN · NANP phones</text>
  <text class="d-s" x="135" y="287">dollars · MDY dates</text>

  <rect class="d-box" x="265" y="224" width="210" height="72" rx="11"/>
  <text class="d-t" x="370" y="252">en-GB</text>
  <text class="d-s" x="370" y="272">NI number · UK phones</text>
  <text class="d-s" x="370" y="287">pounds · DMY dates</text>

  <rect class="d-box" x="500" y="224" width="210" height="72" rx="11"/>
  <text class="d-t" x="605" y="252">en-IN</text>
  <text class="d-s" x="605" y="272">Aadhaar (Verhoeff) · PAN</text>
  <text class="d-s" x="605" y="287">+91 mobiles · lakh/crore</text>

  <path class="d-line" d="M605 296 L605 320 L575 320 L575 336" marker-end="url(#locHead)"/>

  <rect class="d-box d-coral" x="440" y="340" width="270" height="76" rx="11"/>
  <text class="d-t" x="575" y="368">hi-Latn-IN</text>
  <text class="d-s" x="575" y="388">Roman-Hindi detection · lang_mix</text>
  <text class="d-s" x="575" y="403">Devanagari-safe normalizer</text>

  <text class="d-note d-left" x="30" y="356">A child merges its parent's language</text>
  <text class="d-note d-left" x="30" y="372">tags and PII patterns, and overrides</text>
  <text class="d-note d-left" x="30" y="388">the scalar settings it names.</text>
</svg>
