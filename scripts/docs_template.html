<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{title} · vakforge docs</title>
<meta name="description" content="{blurb}">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0B1120" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F7FAFF" media="(prefers-color-scheme: light)">
<link rel="icon" href="../assets/brand/favicon.ico" sizes="any">
<link rel="icon" href="../assets/brand/favicon-32.png" type="image/png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="docs.css">
<script>
  (function () {{
    try {{
      var t = localStorage.getItem("vakforge-theme");
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    }} catch (e) {{}}
  }})();
</script>
</head>
<body>
<header class="top">
  <button class="menu-btn" type="button" id="menu-btn" aria-label="Open navigation" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <a class="brand" href="../"><img src="../assets/brand/logo-mark.png" alt="" width="26" height="26">vakforge<span class="brand-docs">docs</span></a>
  <div class="search" id="search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input type="search" id="search-input" placeholder="Search docs" aria-label="Search docs" autocomplete="off">
    <kbd>/</kbd>
    <div class="search-results" id="search-results" role="listbox" hidden></div>
  </div>
  <nav class="top-links" aria-label="Site">
    <a href="../">Site</a>
    <a href="{repo}" target="_blank" rel="noopener">GitHub</a>
    <a href="https://pypi.org/project/vakforge/" target="_blank" rel="noopener">PyPI</a>
    <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch theme" title="Switch theme">
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </nav>
</header>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    {sidebar}
    <div class="sb-foot">v{version} · <a href="{repo}/blob/main/{source}" target="_blank" rel="noopener">Edit this page</a></div>
  </aside>
  <main class="content">
    <article class="prose" id="article">
      {body}
    </article>
    {prev_next}
    <footer class="page-foot">
      <span>Apache-2.0 · vakforge</span>
      <a href="{repo}/blob/main/{source}" target="_blank" rel="noopener">Edit this page on GitHub</a>
    </footer>
  </main>
  <aside class="right">{toc}</aside>
</div>
<script src="docs.js"></script>
</body>
</html>
