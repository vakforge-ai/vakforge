name: Feature request
description: Propose a change to the CLI, schema, pipeline, recipes or serving.
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should vakforge do? Commands, flags or schema fields if you have them in mind.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - schema / validate
        - inspect
        - recommend
        - prepare (ingest, transcribe, redact, consent)
        - synth
        - train / recipes
        - eval
        - serve / protocols
        - agent skill
        - landing page
        - docs
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: rules
    attributes:
      label: Project rules
      options:
        - label: This does not add language-specific logic to core (that belongs in a locale pack).
          required: true
        - label: This does not weaken PII redaction or consent checks without a logged warning.
          required: true
