name: release

# Publishes to PyPI when a version tag (v0.0.1, v0.1.0, ...) is pushed.
# Uses PyPI trusted publishing: no API token is stored anywhere.
#
# Actions are pinned to a commit SHA, the only immutable reference GitHub offers;
# the trailing comment says which release each SHA is.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  # The uv that builds and checks what goes to PyPI is pinned like everything else in
  # this path. Keep it in step with ci.yml.
  UV_VERSION: "0.12.18"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # the ancestry check below needs the history
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"

      - name: Tag matches both declared versions
        run: |
          pkg=$(uv run --no-project python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          mod=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' vakforge/__init__.py)
          [ "$pkg" = "$mod" ] || { echo "pyproject $pkg != vakforge.__version__ $mod"; exit 1; }
          [ "v$pkg" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != version v$pkg"; exit 1; }

      - name: Tag is on main
        # Nothing should reach PyPI that did not go through a reviewed merge. origin/main
        # is already here: the checkout above fetches every branch (fetch-depth: 0), with
        # the token it still has. A second `git fetch` failed on a private repository,
        # because persist-credentials: false leaves git nothing to authenticate with.
        run: |
          git merge-base --is-ancestor "${GITHUB_REF_NAME}" origin/main \
            || { echo "${GITHUB_REF_NAME} is not an ancestor of origin/main"; exit 1; }

      - run: uv sync --locked --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv build
      - run: uv run --locked --group ci twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The `pypi` environment should require manual approval: PyPI versions are
    # immutable, so this is the last point at which a mistake can be stopped.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  # A tag on its own is invisible on the repo page: GitHub only shows a Release if
  # something creates one. This publishes the notes and attaches the same wheel and
  # sdist that went to PyPI, so the two cannot drift.
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
