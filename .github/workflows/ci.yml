name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default; a job that needs more asks for it.
permissions:
  contents: read

# A new push supersedes the run in progress for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Without it setup-uv installs whatever uv is newest, so the same commit could build,
  # lock-check and audit under a different uv next week. One place to bump.
  UV_VERSION: "0.12.18"

# Actions are pinned to a commit SHA, the only immutable reference GitHub offers.
# A moving tag like `v7` can be repointed at any commit by whoever owns the action.
# Dependabot updates these SHAs; the trailing comment says which release each one is.

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - run: uv sync --locked --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Every version requires-python admits. pip installs on any of them regardless
        # of the classifiers, so an untested one is installed untested.
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --group dev
      - run: uv run pytest

  # Windows is not a nicety here: paths, line endings and soundfile all behave
  # differently, and the project is developed on Windows and tested on Linux.
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - run: uv sync --locked --group dev
      - run: uv run pytest

  docs:
    # site/docs/ is generated from docs/*.md and committed, because Cloudflare Pages
    # serves site/ as-is with no build step. Editing a doc without rebuilding would
    # silently publish the old page, so the build has to be reproducible in CI.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - run: uv run --group docs python scripts/build_docs.py
      - name: site/docs is up to date with docs/
        run: |
          git diff --exit-code -- site/docs || {
            echo "::error::site/docs/ is stale. Run: uv run --group docs python scripts/build_docs.py"
            exit 1
          }

  # Tests the artefact users actually install, not the source checkout.
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - run: uv build
      # Tools run from the locked `ci` group, not `uvx`, which would fetch whatever
      # version is newest on the day.
      - name: Metadata is valid for PyPI
        run: uv run --locked --group ci twine check dist/*
      - name: Install the wheel into a clean environment
        # The pip that ships with the interpreter, as a user would have it — upgrading it
        # first would make the result depend on the day the job ran.
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/pip check
      - name: Smoke-test the installed CLI
        run: |
          cd /tmp   # outside the source tree, so nothing resolves from it
          /tmp/clean/bin/vakforge --version
          /tmp/clean/bin/vakforge --help
          /tmp/clean/bin/vakforge locales
          /tmp/clean/bin/vakforge schema -o /tmp/schema.json
          /tmp/clean/bin/vakforge init smoke --locale en-US
          echo 'Refunds take 5 days.' > smoke/data/raw/faq.md
          /tmp/clean/bin/vakforge inspect smoke/data/raw -o /tmp/inspect.json
          /tmp/clean/bin/vakforge recommend /tmp/inspect.json -o /tmp/rec.json

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - run: uv run --locked --group dev --group ci pytest --cov=vakforge --cov-branch --cov-fail-under=90

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - name: Audit the locked runtime dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt > locked.txt
          uv run --locked --group ci pip-audit --requirement locked.txt --strict

  # The one check the branch ruleset requires. Listing every job and matrix entry there
  # instead would go stale the day a Python version is added or dropped. `always()`, not
  # `!cancelled()`: a required check that is skipped counts as passed.
  required:
    if: always()
    needs: [lint, test-linux, test-windows, docs, package, coverage, dependency-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "::error::a job this depends on ended $r"; exit 1; }
          done
